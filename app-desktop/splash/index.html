<style>
  :root { --bg: #f9fafb; --fg: #1f2937; --muted: #6b7280; --accent: #2563eb; --track: #e5e7eb; }

  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  img { width: 112px; height: 112px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .bar { width: 220px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar::after {
    content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
