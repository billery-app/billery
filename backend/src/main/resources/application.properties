spring.application.name=billery

# Server
server.port=8080

# Behind a reverse proxy (Caddy, nginx, Traefik, ...) the proxy terminates TLS and sends
# X-Forwarded-Proto / -Host / -For. Honouring them makes the backend see the public URL for
# same-origin write checks and generated URLs (logo uploads), and lets it emit HSTS only over
# HTTPS. Only safe when the backend is reachable through a proxy that overwrites these headers.
server.forward-headers-strategy=framework

# CORS: only needed when the frontend runs on ANOTHER origin than the API (comma-separated
# origins, e.g. https://app.example.com). Empty = same-origin only, which is what the bundled SPA
# and every reverse-proxy setup use. Configured origins are also trusted by the API write-origin
# check; CORS itself does not replace that protection.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# GoBD export limits (one export is assembled in memory). Exceeding one answers HTTP 413, a busy
# export slot HTTP 429. Raise them only together with the JVM heap.
export.max-documents=${EXPORT_MAX_DOCUMENTS:10000}
export.max-documents-with-files=${EXPORT_MAX_DOCUMENTS_WITH_FILES:2000}
export.max-output-bytes=${EXPORT_MAX_OUTPUT_BYTES:134217728}
export.max-period-days=${EXPORT_MAX_PERIOD_DAYS:3660}
export.max-concurrent=${EXPORT_MAX_CONCURRENT:1}

# File upload
# DOCX/ODT imports also enforce 2,000 ZIP entries, 20 MB total expanded data, a 100:1 per-entry
# compression-ratio ceiling, and a 30-second ZIP inspection deadline in FileSecurityService.
# The synchronous POI/ODF Toolkit parsers expose no safe per-call timeout; their input is bounded
# by the checks above, but a hard parser execution timeout is not available without isolation.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.main.web-application-type=servlet

# Operational metrics: Prometheus format at /prometheus on a port of their own, never on the
# application's port. Off unless BILLERY_METRICS_PORT is set (-1 = no HTTP endpoint at all), so the
# desktop app and a default install open no further port. Only the prometheus endpoint exists.
management.server.port=${BILLERY_METRICS_PORT:-1}
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.access.default=none
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=billery
# Buckets for latency percentiles in the alert rules (deploy/saas/monitoring/alerts.yml).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
