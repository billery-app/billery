spring.application.name=billery

# Server. Desktop mode is single-user and has no authentication, so the
# backend must only be reachable from this machine.
server.port=8080
server.address=127.0.0.1

# The Tauri window loads the SPA from this backend (same origin), so CORS is
# not needed for the app itself; the dev server origin stays allowed.
cors.allowed-origins=http://localhost:5173

spring.main.web-application-type=servlet
