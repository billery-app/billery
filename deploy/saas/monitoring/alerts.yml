# Alert rules for Prometheus. Scrape the backend at <backend>:BILLERY_METRICS_PORT/prometheus,
# see prometheus.example.yml and docs/operations/ops-gotchas.md. The thresholds are a start: adjust
# them to your traffic. Tested by alerts.test.yml (promtool test rules).
groups:
  - name: billery
    rules:
      - alert: BilleryWatchdog
        # Always firing: the heartbeat of the alerting itself. Route it to a dead man's switch
        # (alertmanager.example.yml): when it stops arriving, Prometheus or Alertmanager is down and
        # no other alert would reach you either.
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "The alerting works"
          description: "Always firing on purpose. If the dead man's switch stops receiving it, Prometheus or Alertmanager is down."

      - alert: BilleryMetricsMissing
        expr: up{job="billery"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Billery does not answer the metrics scrape"
          description: "The backend is down or the metrics port is not reachable. Check docker ps and the logs."

      - alert: BilleryServerErrors
        # Share of requests answered with 5xx; only when there is traffic to speak of.
        expr: |
          sum(rate(http_server_requests_seconds_count{application="billery", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="billery"}[5m])) > 0.05
          and sum(rate(http_server_requests_seconds_count{application="billery"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 % of the requests fail with a server error"
          description: "See the backend log for the stack traces; http_server_requests_seconds_count names the URI."

      - alert: BillerySlowRequests
        # The 95th percentile of the API, without the GoBD export and the PDF downloads (slow by design).
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="billery", uri=~"/api/.*", uri!~"/api/export/.*|/api/invoices/\\{id\\}/pdf"}[5m]))) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "95 % of the API requests take longer than 2 s"
          description: "Check CPU (process_cpu_usage), the database pool and the database itself."

      - alert: BilleryDatabasePoolExhausted
        expr: max(hikaricp_connections_pending{application="billery"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests wait for a database connection"
          description: "All connections of the pool are in use for 5 minutes: a slow database or long-running requests."

      - alert: BilleryAbuseLimitReached
        # A system-wide 24-hour limit refused a request: nobody can sign up, or no invitation
        # mail goes out, until the window passes. Either abuse or the limit is too low.
        expr: |
          sum by (quota) (increase(billery_quota_refused_total{application="billery", scope="system"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "A system-wide limit of {{ $labels.quota }} is reached"
          description: "Nobody can sign up (signup) or receive an invitation mail (invitation_mail) for up to 24 hours. Look for abuse in the log; if it is real growth, raise BILLERY_SIGNUPS_PER_DAY or BILLERY_INVITATION_MAILS_PER_DAY."

      - alert: BilleryAbuseSuspected
        # Many refusals by the limits per user, source IP, recipient or company (customer_mail:
        # mails to customers) within an hour: someone is trying more than the limits allow. The
        # limits hold; this is for a look at the source.
        expr: |
          sum by (quota, scope) (increase(billery_quota_refused_total{application="billery", scope=~"user|ip|recipient|tenant"}[1h])) > 10
        labels:
          severity: warning
        annotations:
          summary: "Many requests hit the {{ $labels.quota }} limit per {{ $labels.scope }}"
          description: "More than 10 refusals in an hour. The limits hold; check the proxy log for the source and block it there if it goes on."

      - alert: BilleryHeapNearlyFull
        expr: |
          sum(jvm_memory_used_bytes{application="billery", area="heap"})
            / sum(jvm_memory_max_bytes{application="billery", area="heap"}) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The Java heap is more than 90 % full"
          description: "Raise BACKEND_MEMORY_LIMIT, or look for a request that holds much memory."

      - alert: BilleryDiskSpaceLow
        # The volumes the backend writes to (working directory, logs, uploads; see
        # management.metrics.system.diskspace.paths). A path that does not exist reports a total of 0.
        expr: |
          min by (path) (disk_free_bytes{application="billery"} / disk_total_bytes{application="billery"}) < 0.15
          and min by (path) (disk_total_bytes{application="billery"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15 % free on {{ $labels.path }}"
          description: "Uploads or logs will fail when it is full. Free space or grow the volume; check the backups next to it (check.sh)."

      - alert: BilleryDiskSpaceCritical
        expr: |
          min by (path) (disk_free_bytes{application="billery"} / disk_total_bytes{application="billery"}) < 0.05
          and min by (path) (disk_total_bytes{application="billery"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5 % free on {{ $labels.path }}"
          description: "Uploads and logs fail soon. Free space now."

      - alert: BilleryFileStoreErrors
        # The store of the uploaded files (the uploads directory, or the bucket with
        # BILLERY_FILES_STORE=s3) failed: uploads and PDFs with a logo fail, everything else works.
        expr: |
          sum by (operation) (increase(billery_files_store_errors_total{application="billery"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "The file store fails ({{ $labels.operation }})"
          description: "Uploads or logos cannot be stored or read. Check the bucket (credentials, reachability) or the uploads volume; the backend log has the cause."

      - alert: BillerySystemMailFailing
        # The operator's SMTP account (MAIL_*) fails: invitations are created, but their mail does
        # not go out (the inviting user is told).
        expr: |
          sum by (reason) (increase(billery_mails_total{application="billery", kind="system", outcome="failed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "System mails fail ({{ $labels.reason }})"
          description: "Invitation mails do not go out. Check MAIL_HOST, MAIL_USERNAME / MAIL_PASSWORD and whether the server may reach the mail server; the backend log has the cause."

      - alert: BilleryCompanyMailsFailing
        # Most mails to customers fail, across companies: one company with a wrong password is
        # its own matter (it sees the error), but connect or timeout failures for many usually mean
        # the server may not reach mail servers at all (outgoing ports 465 / 587 blocked).
        expr: |
          sum by (reason) (increase(billery_mails_total{application="billery", kind="company", outcome="failed"}[1h])) > 5
            and on ()
          sum(increase(billery_mails_total{application="billery", kind="company", outcome="failed"}[1h]))
            > sum(increase(billery_mails_total{application="billery", kind="company", outcome="sent"}[1h]))
        labels:
          severity: warning
        annotations:
          summary: "Most mails to customers fail ({{ $labels.reason }})"
          description: "More mails to customers failed than went out in the last hour. connect / timeout: check that the server may open outgoing connections to ports 465 and 587 (many hosting providers block them by default). auth / rejected: the companies' own settings; they see the error in the send dialog."

  - name: billery-host
    # Needs node_exporter on the host (not part of the kit): the volumes the backend does not see,
    # above all the database (when it runs on this server) and the local backups.
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15 % free on {{ $labels.mountpoint }}"
          description: "The database stops writing and backups fail when it is full. Free space or grow the disk; delete old local backups only if copies exist off the server."
