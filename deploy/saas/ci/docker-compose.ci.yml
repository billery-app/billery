# CI only (.github/workflows/saas-stack.yml). The real deployment kit, with two differences: the
# application image is the one built in the job (not pulled from the registry), a mock OpenID
# provider takes the place of a real one, and Mailpit catches the mail (ci/journey.sh reads the
# invitation mail through its API). Nothing here belongs in a deployment.
services:
  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    container_name: billery-saas-mock-idp
    environment:
      JSON_CONFIG_PATH: /config/mock-idp.json
    volumes:
      - ./ci/mock-idp.json:/config/mock-idp.json:ro
    networks:
      - billery-network

  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: billery-saas-mailpit
    networks:
      - billery-network

  backend:
    image: billery-saas:ci
    pull_policy: never
    depends_on:
      mock-idp:
        condition: service_started
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
